name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Beat This! model checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torch-hub-beat-this-${{ runner.os }}
      - name: Install rubberband-cli (M9 production warp engine)
        run: sudo apt-get update && sudo apt-get install -y rubberband-cli
      - run: uv sync --extra core --extra warp-prototype --extra warp --extra dev
      - run: uv run pytest -m "not gui"

  test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Qt runtime libraries (headless/offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1
      - run: uv sync --extra gui --extra dev
      - run: uv run pytest tests/gui -m gui
        env:
          QT_QPA_PLATFORM: offscreen
